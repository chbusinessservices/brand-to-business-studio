# Netlify Configuration for BrandToBusinessStudio

[build]
  command = "bun run build"
  publish = "dist"

[[redirects]]
  from = "/auth/sign-in"
  to = "/auth/login"
  status = 307

[[redirects]]
  from = "/auth/sign-in/*"
  to = "/auth/login"
  status = 307

[[redirects]]
  from = "/oauth/complete/google"
  to = "/auth/callback"
  status = 200

[[redirects]]
  from = "/api/public/agency-agent-chat"
  to = "/.netlify/functions/oauth-handoff"
  status = 200

[build.environment]
  NODE_VERSION = "18.x"
  NITRO_PRESET = "netlify"

# Supabase secrets (omit from build output)
SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,AUTH_SERVICE_ROLE"

[functions]
  directory = "src/functions/src"
